version: '3.9'

services:

  # =========================
  # GO LANG AI MIDDLEWARE
  # =========================
  golang-ai:
    build: ./golang
    container_name: ai-golang
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - redis
      - ollama
      - qdrant
    restart: always

  # =========================
  # OLLAMA (LLM MODEL)
  # =========================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: always

  # =========================
  # REDIS (CACHE + RATE LIMIT)
  # =========================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  # =========================
  # VECTOR DB (RAG)
  # =========================
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  ollama_models:
  qdrant_data: