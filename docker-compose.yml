version: "3.9"

services:

  # =========================
  # GO AI MIDDLEWARE (CORE API)
  # =========================
  golang-ai:
    build:
      context: ./golang
      dockerfile: Dockerfile
    container_name: ai-golang
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - redis
      - ollama
      - qdrant
    restart: always
    networks:
      - ai-network

  # =========================
  # OLLAMA (LLM SERVER)
  # =========================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: always
    networks:
      - ai-network

  # =========================
  # REDIS (CACHE + RATE LIMIT)
  # =========================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - ai-network

  # =========================
  # QDRANT (VECTOR DB - RAG)
  # =========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    networks:
      - ai-network

volumes:
  ollama_models:
  qdrant_data:

networks:
  ai-network:
    driver: bridge